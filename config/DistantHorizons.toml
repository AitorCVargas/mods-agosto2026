# OMNIA low-end + shaders profile for Distant Horizons 3.1.2-b
# Goal: see distant terrain without melting the GPU/CPU.
# With Iris shaders, DH is expensive — keep generation off while playing.

[client]
	qualityPreset = "MINIMUM"
	threadPreset = "MINIMAL_IMPACT"
	# Master LOD toggle (DH main rendering)
	# (advanced.debugging.enableRendering is the debug wireframe — leave that alone)

	[client.advanced.autoUpdater]
	enableAutoUpdater = false
	enableSilentUpdates = false

	[client.advanced.graphics]
	enableSsao = false
	overrideVanillaGraphicsSettings = true

		[client.advanced.graphics.quality]
		lodChunkRenderDistanceRadius = 32
		maxHorizontalResolution = "CHUNK"
		horizontalQuality = "LOWEST"
		verticalQuality = "HEIGHT_MAP"
		transparency = "DISABLED"
		lodShading = "AUTO"
		grassSideRendering = "AS_DIRT"
		ditherDhFade = false
		vanillaFadeMode = "NONE"
		dhFadeFarClipPlane = true
		lodBiomeBlending = 0
		brightnessMultiplier = "1.0"
		saturationMultiplier = "1.0"

		[client.advanced.graphics.genericRendering]
		enableGenericRendering = false
		enableBeaconRendering = false
		enableCloudRendering = false
		enableMultiLayerClouds = false

		[client.advanced.graphics.noiseTexture]
		enableNoiseTexture = false
		noiseSteps = 1
		noiseDropoff = 0

		[client.advanced.graphics.culling]
		enableCaveCulling = true
		disableFrustumCulling = false
		disableShadowPassFrustumCulling = false
		blocksToIgnore = "NON_COLLIDING"
		tintWithAvoidedBlocks = false

	[common.worldGenerator]
	# Biggest FPS killer while playing. LODs still show for chunks you already visited.
	enableDistantGeneration = false
	distantGeneratorMode = "PRE_EXISTING_ONLY"
	showGenerationProgress = "DISABLED"

	[common.multiThreading]
	# 16 threads was melting laptops. Keep DH quiet in background.
	numberOfThreads = 2
	threadRunTimeRatio = "0.25"
	threadPriority = 3

	[common.logging.warning]
	showLowMemoryWarningOnStartup = false
	showPoolInsufficientMemoryWarning = false
	showHighVanillaRenderDistanceWarning = false
	showReplayWarningOnStartup = false
	showUpdateQueueOverloadedChatWarning = false
	showSlowWorldGenSettingWarnings = false
	showModCompatibilityWarningsOnStartup = false
	logGarbageCollectorWarning = false
	showGarbageCollectorWarning = false

[server]
	enableServerGeneration = false
	enableRealTimeUpdates = false
	synchronizeOnLoad = false
